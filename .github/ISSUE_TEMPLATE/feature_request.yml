name: 功能建议
description: 说明当前需求、使用场景和期望行为
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        请先阅读 [README](https://github.com/Aethersailor/SubConverter-Extended/blob/master/README.md)、[Wiki](https://github.com/Aethersailor/SubConverter-Extended/wiki) 并检索现有 Issue。请描述需求和用户影响，不必预先确定实现方案。

        不要粘贴真实订阅 URL、节点凭据、Token、Cookie 或私有配置。
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已确认当前正式 Release 和 Wiki 没有提供等价能力。
          required: true
        - label: 我已检索现有 Issue，没有找到相同建议。
          required: true
        - label: 我已删除或替换所有敏感信息。
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 功能描述
      description: 请详细、清晰地表达你要提出的论述，例如这个问题如何影响到你？你想实现什么功能？目前 SubConverter-Extended 的行为是什么？
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 描述对用户可见的输入、输出、默认值和失败条件。
    validations:
      required: false
