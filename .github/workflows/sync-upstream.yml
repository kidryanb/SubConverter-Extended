name: Sync upstream and rebuild image

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream-master
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out fork
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - name: Sync upstream master
        id: sync
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/Aethersailor/SubConverter-Extended.git 2>/dev/null || \
            git remote set-url upstream https://github.com/Aethersailor/SubConverter-Extended.git

          git fetch upstream master
          python3 scripts/ci/sync_upstream_master.py \
            --upstream-ref upstream/master \
            --target-branch master \
            --origin origin \
            --github-output "$GITHUB_OUTPUT"

      - name: Validate synced master
        if: steps.sync.outputs.changed == 'true'
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          bash tests/ci_delivery_scripts_test.sh
          git diff --check HEAD^1..HEAD

      - name: Push validated master
        if: steps.sync.outputs.changed == 'true'
        run: git push origin HEAD:master

      - name: Trigger image build
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run build-personal-image.yml --ref master
